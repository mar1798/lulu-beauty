name: Node.js CI

on:
  push:
    branches: [ "development", "master", "staging" ]
  pull_request:
    branches: [ "development", "master", "staging" ]

jobs:
  check:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.23.1]

    steps:
      - name: Get repository code
        uses: actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install Dependencies
        run: npm ci
      - run: npm run check
      # Types and lint are not the tests: the 70-odd vitest suites in packages/widgets
      # cover behaviour that typechecks perfectly while being wrong, and nothing else in
      # CI ran them — api.yml only covers apps/api.
      - run: npm test

