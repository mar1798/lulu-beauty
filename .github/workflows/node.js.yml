name: Node.js CI

# Push only, deliberately. Work lands by pushing straight to `development`, and
# a `pull_request` trigger would fire on `synchronize` for every one of those
# pushes while the release PR is open — the same commit checked twice. Required
# status checks match a check run by commit SHA and name, not by event, so the
# run from the push is the run the release PR into `master` waits on.
on:
  push:
    branches: [ "development", "staging" ]

jobs:
  check:
    # Имя, под которым job виден в required status checks у master. Без него оба
    # воркфлоу показывали бы там одинаковое `check`, и различить бэкенд с фронтендом
    # было бы нельзя. Явное имя заодно отвязывает чек от матрицы: иначе GitHub
    # дописал бы версию Node (`check (22.23.1)`), и её повышение сменило бы имя
    # чека — то есть заблокировало бы мержи до правки настроек ветки.
    name: Website and widgets

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.23.1]

    steps:
      - name: Get repository code
        uses: actions/checkout@v5
      - name: Install NodeJs
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # setup-node@v5 caches ~/.npm by itself as soon as package.json has a
          # `packageManager` field, and this repository has one. That would be a
          # second cache over the same directory as the step below, with a key
          # this workflow does not control — off, so the explicit one stays the
          # only owner of ~/.npm.
          package-manager-cache: false
      - name: Cache modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install Dependencies
        run: npm ci
      - run: npm run check
      # Types and lint are not the tests: the 70-odd vitest suites in packages/widgets
      # cover behaviour that typechecks perfectly while being wrong, and nothing else in
      # CI ran them — api.yml only covers apps/api.
      - run: npm test

