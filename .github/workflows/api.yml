name: API CI

on:
  push:
    branches: [ "development", "master", "staging" ]
  pull_request:
    branches: [ "development", "master", "staging" ]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Mirrors tests/conftest.py's placeholders. DATABASE_URL: the DB-integration tests under
    # tests/integration/ skip themselves when Postgres isn't reachable (e.g. local `uv run
    # pytest` without this service), so this env var is what turns them on in CI. The rest are
    # required fields on Settings, which is instantiated at import time — without them, steps
    # that import the app outside pytest (alembic) fail before they run. Placeholders only:
    # nothing here reaches a real Telegram bot or a real deployment.
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-bytes-long
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-bytes-long
      TELEGRAM_BOT_TOKEN: test-telegram-token
      TELEGRAM_BOT_USERNAME: test_bot
      OWNER_PHONE: "+10000000000"
      OWNER_NAME: Test Owner
      OWNER_PASSWORD: test-owner-password

    steps:
      - name: Get repository code
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.1"
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy app
      - name: Apply database migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest
